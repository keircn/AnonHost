name: anonhost

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anonhost-app
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      ANONHOST_BIND: :1984
      ANONHOST_ADMIN_BIND: :1985
      ANONHOST_DB_PATH: /app/data/anonhost.db
      ANONHOST_UPLOAD_DIR: /app/uploads
    volumes:
      - ./data/uploads:/app/uploads
      - ./data:/app/data
    ports:
      - '${ANONHOST_BIND_IP:-127.0.0.1}:${ANONHOST_PORT:-1984}:1984'
      - '${ANONHOST_ADMIN_BIND_IP:-127.0.0.1}:${ANONHOST_ADMIN_PORT:-1985}:1985'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:1984/api/stats']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
