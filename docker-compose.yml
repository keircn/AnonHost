name: anonhost

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anonhost-app
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      ANONHOST_BIND: :1984
      ANONHOST_DB_PATH: /app/data/anonhost.db
      ANONHOST_UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
      - data_volume:/app/data
    ports:
      - '${ANONHOST_BIND_IP:-127.0.0.1}:${ANONHOST_PORT:-1984}:1984'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:1984/api/stats']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  uploads_data:
    external: true
    name: anonhost_uploads_data
  data_volume:
    external: true
    name: anonhost_data
