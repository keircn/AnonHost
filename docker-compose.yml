# COMPOSE_BAKE=true  # enable BuildKit bake for faster builds
# DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1  # legacy BuildKit flags

name: anonhost

services:
  postgres:
    image: postgres:18-alpine
    container_name: anonhost-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anonhost}
      POSTGRES_USER: ${POSTGRES_USER:-anonhost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anonhost} -d ${POSTGRES_DB:-anonhost}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - anonhost

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anonhost-app
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 1984
      DATABASE_URL: postgresql://${POSTGRES_USER:-anonhost}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-anonhost}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "${ANONHOST_BIND_IP:-127.0.0.1}:${ANONHOST_PORT:-1984}:1984"
    command: ["sh", "-c", "pnpm run db:push -- --always-force && pnpm run start"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:1984/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - anonhost

volumes:
  postgres_data:
  uploads_data:

networks:
  anonhost:
