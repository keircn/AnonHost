{{define "uploadForm"}}
<script>
function base64urlEncode(b) {
  for (var s = '', i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function base64urlDecode(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  var t = atob(s), b = new Uint8Array(t.length), i = 0;
  for (; i < t.length; i++) b[i] = t.charCodeAt(i);
  return b;
}
async function encryptFile(file) {
  var key = await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt']);
  var iv = crypto.getRandomValues(new Uint8Array(12));
  var buf = await file.arrayBuffer();
  var enc = await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,buf);
  var raw = await crypto.subtle.exportKey('raw',key);
  var combined = new Uint8Array(12 + enc.byteLength);
  combined.set(iv,0); combined.set(new Uint8Array(enc),12);
  return {blob:new Blob([combined],{type:file.type||'application/octet-stream'}),key:base64urlEncode(new Uint8Array(raw))};
}
</script>
<form id="upload-form" enctype="multipart/form-data">
  <div class="drop-zone" id="drop-zone">
    <input type="file" name="file" id="file-input">
    <div class="dz-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 16V4m0 0L8 8m4-4l4 4M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/>
      </svg>
    </div>
    <div class="dz-text" id="dz-text">Drop a file here or click to browse</div>
    <div class="dz-file" id="dz-file"></div>
    <div class="dz-hint" id="dz-hint">max {{.MaxFileSizeHuman}}</div>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn" id="submit-btn">Upload</button>
  </div>

  <div class="progress" id="progress">
    <div class="progress-bar" id="progress-bar"></div>
  </div>
</form>

<div class="result" id="result">
  <div class="result-url">URL: <a id="result-link" target="_blank"></a></div>
  <div class="result-meta" id="result-meta"></div>
  <div class="result-row">
    <input type="text" id="result-url-input" readonly onclick="this.select()">
    <button class="btn-small" id="copy-btn">Copy</button>
  </div>
</div>
{{end}}
