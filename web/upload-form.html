{{define "uploadForm"}}
<script src="/public/crypto.js"></script>
<script>
function encryptFile(file, onProgress) {
  return AnonCrypto.encryptV2(file, { onProgress: onProgress || function () {} }).then(function (r) {
    return { blob: r.blob, key: r.key, plainSize: r.plainSize, storedSize: r.storedSize };
  });
}
</script>
{{if .Maintenance}}
<style>
  .maintenance-notice {
    border: 1px solid #c90;
    background: #ffc;
    padding: 10px;
    font-size: 12px;
    margin-bottom: 10px;
  }
  .maintenance-notice strong { display: block; font-size: 13px; margin-bottom: 2px; }
  form.maintenance .drop-zone { cursor: not-allowed; opacity: 0.55; pointer-events: none; }
  form.maintenance .encrypt-toggle { cursor: not-allowed; opacity: 0.55; }
</style>
<div class="maintenance-notice">
  <strong>Maintenance mode</strong>
  Uploads are temporarily disabled. Files uploaded earlier remain available.
</div>
{{end}}
<form id="upload-form" enctype="multipart/form-data" data-max-size="{{.MaxFileSize}}"{{if .Maintenance}} class="maintenance"{{end}}>
  <div class="drop-zone" id="drop-zone">
    <input type="file" name="file" id="file-input" aria-label="Choose a file to upload"{{if .Maintenance}} disabled{{end}}>
    <div class="dz-icon" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 16V4m0 0L8 8m4-4l4 4M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/>
      </svg>
    </div>
    <div class="dz-text" id="dz-text">Drop a file here or click to browse</div>
    <div class="dz-file" id="dz-file"></div>
    <div class="dz-hint" id="dz-hint">max {{.MaxFileSizeHuman}}</div>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn" id="submit-btn"{{if .Maintenance}} disabled{{end}}>Upload</button>
    <label class="encrypt-toggle">
      <input type="checkbox" id="encrypt-checkbox" checked>
      <span class="encrypt-label">Encrypt</span>
    </label>
  </div>

  <div class="progress-label" id="progress-label"></div>
  <div class="progress" id="progress">
    <div class="progress-bar" id="progress-bar"></div>
  </div>
</form>

<div class="result" id="result">
  <div class="result-url">URL: <a id="result-link" target="_blank"></a></div>
  <div class="result-meta" id="result-meta"></div>
  <div class="result-del" id="result-del">Delete: <a id="result-del-link"></a></div>
  <div class="result-row">
    <input type="text" id="result-url-input" readonly onclick="this.select()">
    <button class="btn-small" id="copy-btn">Copy</button>
  </div>
</div>

<style>
  .upload-error { border: 1px solid #c00; background: #fee; padding: 10px; display: none; }
  .upload-error.show { display: block; }
  .upload-error-title { font-weight: 700; color: #c00; font-size: 12px; margin-bottom: 4px; }
  .upload-error-msg { font-size: 12px; color: #333; }
</style>
<div class="upload-error" id="upload-error">
  <div class="upload-error-title" id="upload-error-title"></div>
  <div class="upload-error-msg" id="upload-error-msg"></div>
</div>
{{end}}
